name: Linter

on: [push, pull_request]

jobs:
  python-lint:
    runs-on: ubuntu-latest
    name: CI workflow
    steps:
      - uses: actions/checkout@master

      - name: Set up Python 3.8
        uses: actions/setup-python@v2
        with:
          python-version: "3.8"

      - name: Install pylint
        run: |
          pip install pylint

      - name: Add pylint annotator
        uses: jpy-git/pylint-pr-annotator@master

      - name: Run pylint
        run: |
          pylint src/