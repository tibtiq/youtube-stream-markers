# DO NOT MODIFY THIS FILE DIRECTLY
# THIS FILE IS GITHUB ACTION COPIED FROM https://github.com/tibtiq/python-linters
name: Linter

on:
  # allows manual trigger
  workflow_dispatch:
  pull_request:

jobs:
  python-lint:
    runs-on: ubuntu-latest
    name: CI workflow
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        name: formatter
        with:
          args: "format --check"

      - uses: astral-sh/ruff-action@v3
        name: linter
        with:
          args: "check"
